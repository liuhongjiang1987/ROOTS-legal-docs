# 功能建议 · 词根词缀学习助手
name: 功能建议
description: 提出新功能或改进想法
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢分享想法！「词根词缀学习助手」专注 **划词查词、词根词缀拆词、词源树与同根词**。

        请说明建议如何帮助您在 **阅读英文网页时更好地理解与生词记忆**。

  - type: textarea
    id: problem
    attributes:
      label: 您遇到了什么问题，或缺少什么能力？
      description: 例如：「复习时想按词根筛选历史，但当前只能……」
      placeholder: 我在使用扩展时经常感到……
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: 您希望如何实现？
      description: 清晰描述您期望的功能或交互
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 您考虑过的其他方式
      description: 例如用其他工具临时解决、或简化版方案

  - type: dropdown
    id: related_feature
    attributes:
      label: 与哪个现有功能最相关？
      options:
        - 划词查词
        - 词根词缀拆词
        - 词源树
        - 同根词
        - 查词历史 / 复习
        - 单词本
        - AI 语素补全
        - 登录 / 同步
        - 界面 / 主题
        - 其他 / 全新能力
    validations:
      required: true

  - type: checkboxes
    id: user_scenario
    attributes:
      label: 主要使用场景（可多选）
      options:
        - label: 四六级 / 考研等备考阅读
        - label: 雅思 / 托福 / GRE
        - label: 日常英文新闻 / 博客
        - label: 论文 / 技术文档
        - label: 原版书阅读
        - label: 其他

  - type: textarea
    id: additional_context
    attributes:
      label: 补充说明或参考
      description: 可附截图、其他产品参考、Mockup 链接等
